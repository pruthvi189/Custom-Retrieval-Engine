[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-retrieval-engine"
version = "2.0.0"
description = "Custom Retrieval Engine - vector search algorithms (HNSW, KD-Tree, Brute Force) and grounded RAG, deployed as Vercel serverless Python functions"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["engine", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
